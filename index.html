<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NASWAP Five-Year Impact Report</title>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            background: transparent;
        }

        body {
            overflow: hidden;
        }

        #book {
            width: 100%;
            height: 520px;
            margin: 0;
            padding: 0;
            background: transparent;

            --fb-bg: transparent;
            --fb-paper: #ffffff;
            --fb-control-fg: #000000;
        }

        @media (max-width: 700px) {
            #book {
                height: 500px;
            }
        }
    </style>
</head>

<body>

    <div
        id="book"
        data-pdflipbook="naswap-impact-report.pdf"
        data-display-mode="double"
        data-page-numbers="true"
        data-arrows="true"
        data-controls="true"
        data-shadow="always">
    </div>

    <script src="pdflipbook.js"></script>

</body>
</html>
