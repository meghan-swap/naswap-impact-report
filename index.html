<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NASWAP Five-Year Impact Report</title>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            background: transparent;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            overflow: hidden;
        }

        .header {
            text-align: center;
            padding: 0 20px 8px;
            margin: 0;
            color: #000000;
        }

        .header h1 {
            margin: 0;
            padding: 0;
            font-size: 20px;
            font-weight: 700;
            color: #000000;
        }

        .header p {
            margin: 4px 0 0;
            padding: 0;
            font-size: 13px;
            color: #000000;
        }

        #book {
            width: 100%;
            height: 720px;
            margin: 0;
            padding: 0;
            background: transparent;

            --fb-bg: transparent;
            --fb-paper: #ffffff;
            --fb-control-fg: #000000;
        }

        @media (max-width: 700px) {
            .header {
                padding: 0 10px 5px;
            }

            .header h1 {
                font-size: 16px;
            }

            .header p {
                font-size: 11px;
            }

            #book {
                height: 650px;
            }
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>FROM PURPOSE TO IMPACT</h1>
        <p>NASWAP Program &amp; Student Impact Report — Five Year Review</p>
    </div>

    <div
        id="book"
        data-pdflipbook="naswap-impact-report.pdf"
        data-display-mode="double"
        data-page-numbers="true"
        data-arrows="true"
        data-controls="true"
        data-shadow="always">
    </div>

    <script src="pdflipbook.js"></script>

</body>
</html>
