<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NASWAP Five-Year Impact Report</title>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background: #111111;
            font-family: Arial, Helvetica, sans-serif;
        }

        .header {
            text-align: center;
            padding: 18px 20px 12px;
            color: white;
        }

        .header h1 {
            margin: 0;
            font-size: 20px;
        }

        .header p {
            margin: 5px 0 0;
            font-size: 13px;
            opacity: 0.7;
        }

        #book {
            width: 100%;
            height: 850px;
            background: #111111;

            --fb-bg: #111111;
            --fb-paper: #ffffff;
            --fb-control-fg: #ffffff;
        }

        @media (max-width: 700px) {
            #book {
                height: 700px;
            }

            .header h1 {
                font-size: 16px;
            }

            .header p {
                font-size: 11px;
            }
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>FROM PURPOSE TO IMPACT</h1>
        <p>NASWAP Program & Student Impact Report — Five Year Review</p>
    </div>

    <div
        id="book"
        data-pdflipbook="naswap-impact-report.pdf"
        data-display-mode="double"
        data-page-numbers="true"
        data-arrows="true"
        data-controls="true"
        data-shadow="always">
    </div>

    <script src="pdflipbook.js"></script>

</body>
</html>
