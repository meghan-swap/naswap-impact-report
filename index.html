<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NASWAP Five-Year Impact Report</title>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            background: transparent !important;
            overflow: visible;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        #book {
            width: 100%;
            height: 520px;
            margin: 0;
            padding: 0;
            background: transparent !important;
            overflow: visible !important;

            --fb-bg: transparent;
            --fb-paper: #ffffff;
            --fb-control-fg: #000000;
        }

        /*
         * Allow the page shadow to extend beyond
         * the immediate flipbook container.
         */
        #book > div,
        #book canvas {
            overflow: visible !important;
        }

        /*
         * Mobile layout:
         * shorter viewer so the embedded element
         * doesn't leave a large vertical gap.
         */
        @media (max-width: 700px) {
            #book {
                height: 380px;
            }
        }
    </style>
</head>

<body>

    <div
        id="book"
        data-pdflipbook="naswap-impact-report.pdf"
        data-display-mode="auto"
        data-page-numbers="true"
        data-arrows="true"
        data-controls="true"
        data-shadow="always">
    </div>

    <script src="pdflipbook.js"></script>

</body>
</html>
